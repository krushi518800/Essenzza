<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSENZZA | Membership Required</title>
    <meta name="description" content="Store access will be limited to members only. Apply for exclusive access to the modern streetwear brand, ESSENZZA.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://essenzza.in">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://essenzza.in">
    <meta property="og:title" content="ESSENZZA | Membership Required">
    <meta property="og:description" content="Store access will be limited to members only. Apply for exclusive access to the modern streetwear brand, ESSENZZA.">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://essenzza.in">
    <meta name="twitter:title" content="ESSENZZA | Membership Required">
    <meta name="twitter:description" content="Store access will be limited to members only. Apply for exclusive access to the modern streetwear brand, ESSENZZA.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">
    <link rel="stylesheet" href="styles.css">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ESSENZZA",
      "url": "https://essenzza.in",
      "description": "Exclusive modern streetwear brand.",
      "sameAs": [
        "https://instagram.com/essenzza.in"
      ]
    }
    </script>
</head>
<body>
    <div class="background-texture"></div>
    <main class="container">

        <h1 class="brand-name">ESSENZZA</h1>
        <div class="micro-divider"></div>

        <div class="content-wrapper">
            <!-- Initial Content -->
            <div id="initial-content" class="content-section active fade-in-on-load">
                <p class="tagline" style="font-weight: 700;">NOT FOR EVERYONE.</p>
                <p class="secondary-line">Store access will be limited to members only.</p>
                <button id="apply-btn" class="cta-button">Apply for Membership</button>
            </div>

            <!-- Form Content -->
            <div id="form-content" class="content-section">
                <form id="membership-form" autocomplete="off">
                <div class="form-group">
                    <label for="email" class="sr-only">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>

                <div class="form-group">
                    <label for="name" class="sr-only">Name</label>
                    <input type="text" id="name" name="name" placeholder="Name">
                </div>

                <div class="form-group">
                    <label for="mobile" class="sr-only">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="Mobile Number">
                </div>

                <div class="form-group">
                    <label for="message" class="sr-only">Why do you want access?</label>
                    <textarea id="message" name="message" rows="2" placeholder="Why do you want access?"></textarea>
                </div>

                <p class="helper-text">Limited approvals before launch.</p>
                <button type="submit" class="submit-button">Request Access</button>
            </form>
        </div>

            <!-- Success Content -->
            <div id="success-content" class="content-section">
                <p class="success-message">Application received.</p>
            </div>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/intlTelInput.min.js"></script>
    <script src="script.js"></script>

    <a href="https://instagram.com/essenzza.in" target="_blank" rel="noopener noreferrer" class="instagram-link" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="instagram-icon">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
    </a>
</body>
</html>
